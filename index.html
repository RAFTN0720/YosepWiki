<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>대법전 / 요셉위키</title>

<link rel="icon" href="favicon.png" type="image/png">

<style>
:root {
--bg: #0f1217;
--panel: #151a21;
--text: #e7eef7;
--muted: #9fb0c3;
--accent: #4ea1ff;
--border: #223042;
--moredarker: #10151b;
}

body {
margin: 0;
background: var(--bg);
color: var(--text);
font: 15px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Apple SD Gothic Neo, sans-serif;
transition: background 0.3s ease, color 0.3s ease;
}

/* 헤더 */
header {
padding: 18px 20px;
border-bottom: 2px solid var(--border);
background: linear-gradient(0deg, var(--panel), #12161c);
position: sticky;
top: 0;
z-index: 10;
}

header h1 {
margin: 0;
font-size: 18px;
letter-spacing: 0.3px;
}

/* 메뉴 버튼 */
.menu-btn {
position: absolute;
right: 20px;
top: 16px;
font-size: 22px;
cursor: pointer;
user-select: none;
}

/* 오른쪽 슬라이드 메뉴 */
.side-menu {
position: fixed;
top: 0;
right: -290px;
width: 260px;
height: 100%;
background: var(--panel);
border-left: 3px solid var(--border);
transition: right 0.25s ease;
z-index: 50;
padding: 14px;
box-shadow: -3px 0 10px rgba(0,0,0,0.4);
}
.side-menu.open {
right: 0;
}

.side-header {
display: flex;
justify-content: space-between;
font-size: 17px;
padding-bottom: 10px;
border-bottom: 1px solid var(--border);
}

.close-btn {
background: none;
border: none;
color: var(--text);
font-size: 18px;
cursor: pointer;
}

.side-tabs {
display: flex;
gap: 6px;
margin-top: 14px;
}
.side-tab {
flex: 1;
text-align: center;
padding: 8px;
background: var(--border);
border-radius: 6px;
cursor: pointer;
}
.side-tab.active {
background: var(--accent);
color: white;
font-weight: bold;
}

.panel {
margin-top: 14px;
}

.theme-option {
display: flex;
gap: 6px;
padding: 6px 0;
cursor: pointer;
}

/* 오버레이 */
.overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.4);
display: none;
z-index: 40;
}
.overlay.show {
display: block;
}

/* 콘텐츠 */
.container {
max-width: 860px;
margin: 0 auto;
padding: 16px;
}

.search {
display: flex;
gap: 10px;
margin: 12px 0 20px;
}

.search input {
flex: 1;
padding: 10px 12px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--panel);
color: var(--text);
}

/* 학년 탭 */
.tabs {
display: flex;
gap: 8px;
margin-bottom: 20px;
}
.tab {
flex: 1;
text-align: center;
padding: 10px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--panel);
cursor: pointer;
}
.tab.active {
background: var(--accent);
color: #fff;
font-weight: bold;
}

/* 리스트 */
.list {
display: flex;
flex-direction: column;
gap: 8px;
}

.item {
border: 1px solid var(--border);
border-radius: 12px;
background: var(--panel);
overflow: hidden;
}

.item-header {
display: flex;
justify-content: space-between;
padding: 12px 14px;
cursor: pointer;
}

.title {
font-weight: 600;
}

.chevron {
color: var(--muted);
transition: 0.2s;
}
.item.open .chevron {
transform: rotate(90deg);
color: var(--accent);
}

.content {
display: none;
border-top: 1px solid var(--border);
background: var(--moredarker);
}
.item.open .content {
display: block;
}

.content-inner {
padding: 14px;
white-space: pre-wrap;
}

.tags {
display: flex;
flex-wrap: wrap;
gap: 6px;
}
.tag {
font-size: 11px;
color: var(--muted);
border: 1px solid var(--border);
border-radius: 99px;
padding: 2px 8px;
}

/* important 강조 스타일 */
.item.important .item-header {
background: #3a2f00; /* 진한 브라운/골드 느낌 배경 */
border: 2px solid #ffd700; /* 금색 테두리 */
border-radius: 12px; /* 모서리 둥글게 */
padding: 10px; /* 내부 여백 */
}

.item.important .title {
color: #ffd700; /* 눈에 띄는 금색 글자 */
font-weight: 700;
text-shadow: 1px 1px 2px #b38f00; /* 금빛 반짝임 느낌 */
}

/* 라이트 테마 */
body.light {
--bg: #eef2f6;
--panel: #ffffff;
--text: #222;
--border: #ccd3dd;
--accent: #4ea1ff;
--muted: #75859a;
--moredarker: #c1d1dd;
}

/* 블루 테마 */
body.blue {
--bg: #0d1a2a;
--panel: #102334;
--text: #e8f5ff;
--border: #24435e;
--accent: #4ea1ff;
--muted: #879cb4;
--moredarker: #252545;
}

body.red {
--bg: #2a0d0f; /* 전체 배경: 짙은 와인빛 */
--panel: #341019; /* 패널 배경: 살짝 밝은 버건디 */
--text: #ffe8e8; /* 글자색: 연한 분홍/크림톤 */
--border: #6b2e3a; /* 테두리: 진한 장미빛 */
--accent: #ff6b8f; /* 강조 색상: 파스텔 핑크/레드 */
--muted: #a87a8c; /* 덜 강조된 색상: 연한 장미/파스텔 */
--moredarker: #33221a; /* 더 어두운 영역: 깊은 갈색 섞인 레드 */
}

/* 그린 테마 */
body.green {
--bg: #0d2a1a; /* 전체 배경: 짙은 녹색 */
--panel: #103422; /* 패널 배경: 조금 밝은 녹색 */
--text: #e8ffe8; /* 글자색: 연한 연두색/크림톤 */
--border: #2e6b3e; /* 테두리: 진한 초록색 */
--accent: #4eff6b; /* 강조 색상: 밝은 초록 */
--muted: #7aa87a; /* 덜 강조된 색상: 연한 초록 */
--moredarker: #1a3322; /* 더 어두운 영역: 아주 짙은 녹색 */
}

body.yellow {
--bg: #fffbe6; /* 전체 배경: 연한 크림빛 옐로우 */
--panel: #fff1a8; /* 패널 배경: 부드러운 파스텔 옐로우 */
--text: #3a2e00; /* 글자색: 따뜻한 다크 브라운 */
--border: #d4b96a; /* 테두리: 은은한 황금빛 */
--accent: #ffe066; /* 강조 색상: 밝고 화사한 노랑 */
--muted: #000000; /* 덜 강조: 연한 파스텔 노랑 */
--moredarker: #f5e88e;/* 더 어두운 영역: 골드/브라운 섞인 색 */
}

body.rainbow {
--panel: rgba(255, 255, 255, 0.15); /* 패널은 반투명으로 배경이 살짝 보이게 */
--text: #ffffff; /* 글자색은 흰색으로 대비 */
--border: #ffffff33; /* 연한 흰색 테두리 */
--accent: #ffd700; /* 강조 색상: 금색 느낌 */
--muted: #ffffff55; /* 덜 강조: 반투명 흰색 */
--moredarker: #ffffff22; /* 더 어두운 영역: 거의 투명 흰색 */

/* 배경 애니메이션 적용 */
animation: rainbowBG 20s linear infinite;
background: linear-gradient(999deg, #ff6b6b, #f9ca24, #6ab04c, #2980b9, #8e44ad, #ff6b6b);
background-size: 300% 300%; /* 배경을 크게 만들어서 이동 가능 */
}

@keyframes rainbowBG {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
</style>
</head>

let currentGrade = 1;

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("emptyState");
const searchInput = document.getElementById("searchInput");

/* ------------------------------
📌 메뉴 버튼
--------------------------------*/
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const closeMenu = document.getElementById("closeMenu");
const overlay = document.getElementById("overlay");

menuBtn.onclick = () => {
sideMenu.classList.add("open");
overlay.classList.add("show");
};

closeMenu.onclick = () => {
sideMenu.classList.remove("open");
overlay.classList.remove("show");
};

overlay.onclick = closeMenu;

/* ------------------------------
📌 메뉴 탭 전환
--------------------------------*/
document.querySelectorAll(".side-tab").forEach(tab => {
tab.onclick = () => {
document.querySelectorAll(".side-tab").forEach(t => t.classList.remove("active"));
tab.classList.add("active");

document.querySelectorAll(".panel").forEach(p => p.style.display = "none");

document.getElementById("panel-" + tab.dataset.panel).style.display = "block";
};
});

/* ------------------------------
📌 테마 변경
--------------------------------*/
document.querySelectorAll("input[name='theme']").forEach(radio => {
radio.onchange = () => {
document.body.classList.remove("light", "blue", "green", "red", "rainbow");
if (radio.value !== "dark") {
document.body.classList.add(radio.value);
}
};
});

/* ------------------------------
📌 아이템 생성
--------------------------------*/
function makeItem(entry) {
const item = document.createElement("div");
item.className = "item";
if (entry.important) item.classList.add("important");

const header = document.createElement("div");
header.className = "item-header";

const left = document.createElement("div");
left.style.display = "flex";
left.style.flexDirection = "column";
left.style.gap = "6px";

const title = document.createElement("div");
title.className = "title";
title.textContent = entry.title;

const tagsWrap = document.createElement("div");
tagsWrap.className = "tags";

entry.tags.forEach(t => {
const tag = document.createElement("span");
tag.className = "tag";
tag.textContent = t;
tagsWrap.appendChild(tag);
});

left.appendChild(title);
if (entry.tags.length) left.appendChild(tagsWrap);

const right = document.createElement("div");
right.className = "chevron";
right.textContent = "›";

header.appendChild(left);
header.appendChild(right);

const content = document.createElement("div");
content.className = "content";

const inner = document.createElement("div");
inner.className = "content-inner";
inner.textContent = entry.content;

content.appendChild(inner);

header.onclick = () => {
const isOpen = item.classList.contains("open");
document.querySelectorAll(".item.open").forEach(e => e.classList.remove("open"));
if (!isOpen) item.classList.add("open");
};

item.appendChild(header);
item.appendChild(content);
return item;
}

/* ------------------------------
📌 렌더링
--------------------------------*/
function render(q = "") {
listEl.innerHTML = "";
const text = q.trim().toLowerCase();

const filtered = gradeEntries[currentGrade].filter(e => {
if (!text) return true;
const hay = e.title.toLowerCase() + " " + e.tags.join(" ").toLowerCase();
return hay.includes(text);
});

if (filtered.length === 0) {
emptyEl.style.display = "block";
return;
}
emptyEl.style.display = "none";

filtered.forEach(e => listEl.appendChild(makeItem(e)));
}

searchInput.oninput = (e) => render(e.target.value);

/* ------------------------------
📌 학년 탭 전환
--------------------------------*/
document.querySelectorAll(".tabs .tab").forEach(tab => {
tab.onclick = () => {
document.querySelectorAll(".tabs .tab").forEach(t => t.classList.remove("active"));
tab.classList.add("active");

currentGrade = parseInt(tab.dataset.grade, 10);
render(searchInput.value);
};
});

/* 초기 렌더 */
render();
</script>
